name: Build Linux CLI

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      app_version:
        description: "Version embedded in the installer name"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      app_version:
        description: "Installer version override (defaults to tag name or dev)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Resolve installer version
        id: vars
        shell: bash
        run: |
          if [[ -n "${{ inputs.app_version }}" ]]; then
            version="${{ inputs.app_version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="dev"
          fi
          echo "app_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Linux installer
        shell: bash
        run: |
          ./scripts/build_linux_installer.sh --app-version "${{ steps.vars.outputs.app_version }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-learning-linux-installer-${{ steps.vars.outputs.app_version }}
          path: |
            dist-installer/*.tar.gz
          if-no-files-found: error
          overwrite: true
